name: A better skill
description: One of Hildegard's skills led an agent wrong, or missed something, for every model or for one.
labels: [skill]
body:
  - type: markdown
    attributes:
      value: |
        A skill is instructions agents follow on people's own computers, so a suggestion is only ever a proposal. A maintainer reads every word, rewrites what they take in their own words, and it ships only in a signed release. Suggestions that tell agents to run downloaded code, read keys, send files away, hide things from their person or ignore their other instructions are closed, and their authors may be blocked.
  - type: input
    id: skill
    attributes:
      label: Skill
      placeholder: hildegard-3d
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: The model this is for, if it is for one. Leave empty when it's for every model.
      placeholder: claude-opus-5-5, gpt-6.1, qwen3:8b
  - type: textarea
    id: what
    attributes:
      label: What happened, and what would be better
      description: What the agent did following the skill, and what went wrong or could be better.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Suggested change
      description: The words to add or change, and where. Plain text; no commands, links or anything about keys.
      render: text
