name: Auto-merge

# Every pull request the owner opens from a branch here merges itself once all of main's required checks pass, so
# nobody has to come back to press Merge. The checks are the gate: branch protection on main names them, and GitHub
# waits for every one. One of them is the `baney-review` commit status, which a reviewer sets on the exact head it
# reviewed (AGENTS.md, "Review and merge"), so a push after review is a new head that can't merge until it is
# reviewed too. A draft, or a PR from a fork or from anyone else, is left alone.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      # GitHub's own auto-merge, never a merge now: `gh pr merge --auto` merges at once when the repo has auto-merge
      # off or main requires no checks, which would skip CI. enablePullRequestAutoMerge only ever waits for the checks,
      # and refuses when auto-merge is off, which leaves the PR for a manual merge.
      - env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ github.event.pull_request.node_id }}
        run: |
          gh api graphql -f id="$ID" -f query='mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: MERGE}) { clientMutationId } }' \
            || echo "::warning::Auto-merge isn't on for this repo, or main requires no checks yet, so this PR waits for a manual merge."
