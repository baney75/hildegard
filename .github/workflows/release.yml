name: Release

# A tag like v0.1.0 publishes a GitHub release: the CLI for every OS, the one-line installers, SHA256SUMS and the
# desktop app. The app's files also go up under names without the version, so the install page's
# releases/latest/download links never change.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hildegard/studio build
      - run: node scripts/build-release.mjs dist/release
      # install.sh fetches from releases/download/v<version>, so the tag must be exactly that.
      - name: The tag names this version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/release
          retention-days: 7

  desktop:
    uses: ./.github/workflows/desktop.yml

  publish:
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Gather the files, with version-free names for the app
        run: |
          mkdir out
          cp artifacts/release/install.sh artifacts/release/install.ps1 artifacts/release/*.tar.gz out/
          find artifacts -path '*hildegard-app-*' -type f | while read -r f; do
            b=$(basename "$f")
            cp "$f" "out/$b"
            case "$b" in
              *_x64-setup.exe) cp "$f" out/Hildegard_x64-setup.exe ;;
              *_x64_en-US.msi) cp "$f" out/Hildegard_x64.msi ;;
              *_aarch64.dmg) cp "$f" out/Hildegard_aarch64.dmg ;;
              *_amd64.AppImage) cp "$f" out/Hildegard_amd64.AppImage ;;
              *_amd64.deb) cp "$f" out/Hildegard_amd64.deb ;;
            esac
          done
          for f in Hildegard_x64-setup.exe Hildegard_x64.msi Hildegard_aarch64.dmg Hildegard_amd64.AppImage Hildegard_amd64.deb; do
            test -f "out/$f" || { echo "missing $f"; exit 1; }
          done
          # One list of hashes for everything, the installers' own lines included.
          (cd out && sha256sum -- * > SHA256SUMS)
          cat out/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          test -f "$notes" || notes=/dev/null
          gh release create "$GITHUB_REF_NAME" out/* --title "Hildegard ${GITHUB_REF_NAME#v} (pre-alpha)" --notes-file "$notes" --verify-tag
