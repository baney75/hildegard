name: Release

# Publishes a GitHub release: the CLI for every OS, the one-line installers, SHA256SUMS and the desktop app. The
# app's files also go up under names without the version, so the install page's releases/latest/download links never
# change. A version on main with no release yet releases itself: merging a version bump is the whole release, and
# this makes the tag. A pushed tag like v0.1.0 still works. The hourly run catches a merge whose push started no
# workflow (one GitHub's own token made, as auto-merge.yml's are).
on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Which tag this run releases, if any: the pushed tag, or main's version when it has no release yet.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # install.sh fetches from releases/download/v<version>, so the tag must be exactly that.
            test "$GITHUB_REF_NAME" = "$tag" || { echo "The tag $GITHUB_REF_NAME isn't the version, $tag."; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $tag from main."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  cli:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hildegard/studio build
      - run: node scripts/build-release.mjs dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/release
          retention-days: 7

  desktop:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/desktop.yml

  publish:
    needs: [version, cli, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Gather the files, with version-free names for the app
        run: |
          mkdir out
          cp artifacts/release/install.sh artifacts/release/install.ps1 artifacts/release/*.tar.gz out/
          find artifacts -path '*hildegard-app-*' -type f | while read -r f; do
            b=$(basename "$f")
            cp "$f" "out/$b"
            case "$b" in
              *_x64-setup.exe) cp "$f" out/Hildegard_x64-setup.exe ;;
              *_x64_en-US.msi) cp "$f" out/Hildegard_x64.msi ;;
              *_aarch64.dmg) cp "$f" out/Hildegard_aarch64.dmg ;;
              *_amd64.AppImage) cp "$f" out/Hildegard_amd64.AppImage ;;
              *_amd64.deb) cp "$f" out/Hildegard_amd64.deb ;;
            esac
          done
          for f in Hildegard_x64-setup.exe Hildegard_x64.msi Hildegard_aarch64.dmg Hildegard_amd64.AppImage Hildegard_amd64.deb; do
            test -f "out/$f" || { echo "missing $f"; exit 1; }
          done
          # One list of hashes for everything, the installers' own lines included.
          (cd out && sha256sum -- * > SHA256SUMS)
          cat out/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          notes=".github/release-notes/${TAG}.md"
          test -f "$notes" || notes=/dev/null
          # From main, this makes the tag on the commit that was built.
          gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "Hildegard ${TAG#v} (pre-alpha)" --notes-file "$notes"
