<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Hildegard</title>
    <link rel="stylesheet" href="./main.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body class="hg-root">
    <div class="hd">
      <aside class="hd-side">
        <!-- A frame from a real take, the same the Studio's welcome opens on, so the install and the Studio read as one. -->
        <img class="hd-frame" data-frame alt="" width="1600" height="903" />
        <div class="hd-brand">
          <img data-mark alt="" height="34" />
          <img data-wordmark alt="Hildegard" height="26" />
        </div>
        <ol class="hd-stages" id="stages" aria-label="Setting up" hidden></ol>
        <p class="hd-quote">
          “A feather on the breath of God.”
          <br />
          <span>Hildegard of Bingen, 1098–1179</span>
        </p>
      </aside>
      <main class="hd-main" id="main"></main>
    </div>
  </body>
</html>
