<!-- @dsCard group="Layout" height=1960 width=1370 subtitle="One Studio screen, one markup: desktop (wide), iPad portrait (medium), phone (compact)" -->
<div class="hg-root" style="padding:40px;background:var(--panel);display:grid;gap:40px">
  <figure class="frame" style="--w:1290px;--h:800px"><figcaption>Desktop app and desktop browser · 1280 × 800 · wide</figcaption><div class="screen" data-slot></div></figure>
  <div style="display:flex;gap:40px;align-items:flex-start">
    <figure class="frame tablet" style="--w:834px;--h:1000px"><figcaption>iPad portrait · 834 × 1194 · medium</figcaption><div class="screen" data-slot></div></figure>
    <figure class="frame phone" style="--w:390px;--h:844px"><figcaption>iPhone and Android · 390 × 844 · compact</figcaption><div class="screen" data-slot></div></figure>
  </div>
</div>
<style>
  .frame { margin: 0; display: grid; gap: 10px; }
  .frame figcaption { font: 600 12px/16px var(--font-sans); letter-spacing: .04em; color: var(--text-muted); }
  .frame .screen { width: var(--w); height: var(--h); overflow: hidden; border-radius: 14px; border: 1px solid var(--hairline); background: var(--canvas); box-shadow: var(--shadow-2); position: relative; }
  .frame.tablet .screen { border-radius: 28px; }
  .frame.phone .screen { border-radius: 44px; }
  .frame .screen > .hg-app { height: 100%; min-height: 0; overflow: hidden; }
  .hello { display: grid; gap: 6px; }
  .hello h1 { margin: 0; font: 500 56px/58px var(--font-display); letter-spacing: -.01em; }
  .hello p { margin: 0; color: var(--text-secondary); font-size: 17px; line-height: 26px; }
  [data-wc="medium"] .hello h1 { font-size: 40px; line-height: 44px; }
  [data-wc="compact"] .hello h1 { font-size: 32px; line-height: 36px; }
  [data-wc="compact"] .hello p { font-size: 15px; line-height: 22px; }
  [data-wc="compact"] .hg-prompt { --pad: 14px; padding: 14px 14px 12px; border-radius: var(--radius-lg); }
  [data-wc="compact"] .hg-prompt__meta { margin-left: 0; width: 100%; justify-content: space-between; }
  [data-wc="compact"] .where-2, [data-wc="medium"] .where-2 { display: none; }
  .main-strip { display: none; }
  [data-wc="compact"] .main-strip, [data-wc="medium"] .main-strip { display: flex; }
  [data-wc="compact"] .main-strip { flex-wrap: wrap; gap: 4px 16px; padding: 10px 14px; }
  [data-wc="compact"] .main-strip .wide-only { display: none; }
  .art { width: 100%; height: 100%; display: block; }
  .art .bg { fill: var(--sapphire-deep); }
  .art .g { fill: var(--gold); } .art .gs { stroke: var(--gold); fill: none; }
  .art .v { fill: var(--brand-text); } .art .vs { stroke: var(--brand-text); fill: none; }
  .art .s { stroke: var(--silver); fill: none; } .art .t { fill: var(--text-secondary); }
  .art .e { fill: var(--ember); } .art .b { fill: var(--burgundy); }
  .aside-h { font: 600 20px/26px var(--font-display); margin: 0; }
  .mini { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--hairline); font-size: 13px; }
  .mini b { font-weight: 600; font-size: 14px; display: block; }
  .mini small { color: var(--text-muted); font: 400 12px/16px var(--font-mono); }
  .mini > span:last-child { margin-left: auto; }
  .topswitch { display: none; }
  [data-wc="wide"] .topswitch, [data-wc="expanded"] .topswitch { display: inline-flex; }
  [data-wc="compact"] .tile-extra { display: none; }
</style>
<script>
(function () {
  var I = Hildegard.icon;
  var MARK = '/_blob/7825c0dbb5e883c37b5838e0971f67d3', MARK_L = '/_blob/713b2ac385783744f1549b8bd359fc13';
  var WM = '/_blob/7199a976377ee3f5bd34f969a65186b8', WM_L = '/_blob/5b3bf1e7112af49fe28991afbd972e24';
  var light = document.documentElement.getAttribute('data-theme') === 'light';
  var mark = light ? MARK_L : MARK, wm = light ? WM_L : WM;

  function art(kind) {
    var a = {
      image: '<rect class="bg" width="100" height="100"/><circle class="gs" cx="50" cy="58" r="30" stroke-width=".8" opacity=".5"/><circle class="gs" cx="50" cy="58" r="21" stroke-width=".8" opacity=".7"/><circle class="g" cx="50" cy="58" r="12"/><path class="v" d="M0 82 Q25 70 50 80 T100 76 V100 H0Z" opacity=".9"/>',
      music: '<rect class="bg" width="100" height="100"/>' + [14,22,34,48,40,58,66,52,38,46,30,20,26,16].map(function (h, i) { return '<rect class="g" x="' + (9 + i * 6) + '" y="' + (50 - h / 2) + '" width="3" height="' + h + '" rx="1.5" opacity="' + (0.55 + (i % 3) * 0.15) + '"/>'; }).join(''),
      voice: '<rect class="bg" width="100" height="100"/><path class="vs" stroke-width="2" d="M6 50 C18 30 26 70 38 50 S58 26 70 50 S88 66 96 50"/><path class="vs" stroke-width="1" opacity=".5" d="M6 56 C18 40 26 74 38 56 S58 36 70 56 S88 70 96 56"/><circle class="g" cx="70" cy="50" r="3"/>',
      video: '<rect class="bg" width="100" height="100"/><rect class="e" x="10" y="26" width="24" height="48" rx="3" opacity=".75"/><rect class="b" x="38" y="26" width="24" height="48" rx="3" opacity=".9"/><rect class="g" x="66" y="26" width="24" height="48" rx="3" opacity=".8"/><path d="M10 80h80" class="s" stroke-width=".8" stroke-dasharray="2 3"/>',
      model3d: '<rect class="bg" width="100" height="100"/><path class="s" stroke-width="1.2" d="M50 18 78 34v32L50 82 22 66V34zM50 50l28-16M50 50v32M50 50 22 34"/><path class="gs" stroke-width="1.4" d="M50 18 78 34 50 50 22 34z" opacity=".9"/>',
      transcribe: '<rect class="bg" width="100" height="100"/>' + [70,82,60,76,52,68].map(function (w, i) { return '<rect class="t" x="14" y="' + (22 + i * 10) + '" width="' + w + '" height="3" rx="1.5" opacity=".7"/>'; }).join('') + '<rect class="g" x="14" y="22" width="22" height="3" rx="1.5"/>'
    }[kind];
    return '<svg class="art" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' + a + '</svg>';
  }
  var KIND = { image: 'Image', music: 'Music', voice: 'Voice', video: 'Video', model3d: '3D', transcribe: 'Text' };
  var tiles = [
    ['music', 'First Light over the Rhine', '2:04 · ace-step'], ['image', 'Viriditas, the greening', '1024² · flux-dev'],
    ['voice', 'Chapter 3 narration', '11:32 · Agnes'], ['video', 'Abbey cloister, dolly in', '6s · wan-2.2'],
    ['model3d', 'Reliquary box', '18k tris · hunyuan3d'], ['transcribe', 'Interview with Sr. Agnes', '42 min · whisper'],
    ['image', 'Cosmic egg study', '768×1024 · sdxl'], ['music', 'O nobilissima viriditas', '3:10 · ace-step']
  ];
  function tile(t, i) {
    return '<div class="hg-tile' + (i >= 4 ? ' tile-extra' : '') + '"><div class="hg-tile__art">' + art(t[0]) +
      '<span class="hg-tile__kind">' + I(t[0], 14) + KIND[t[0]] + '</span></div><div class="hg-tile__name">' + t[1] + '</div><div class="hg-tile__meta">' + t[2] + '</div></div>';
  }
  var nav = [['studio', 'Studio', 1], ['choir', 'Choir'], ['queue', 'Queue', 0, 3], ['models', 'Models'], ['costs', 'Costs'], ['settings', 'Settings']];
  function navItem(n) { return '<a class="hg-nav-item"' + (n[2] ? ' aria-current="page"' : '') + '>' + I(n[0], 20) + '<span>' + n[1] + '</span>' + (n[3] ? '<span class="hg-nav-item__badge">' + n[3] + '</span>' : '') + '</a>'; }
  var tabs = [['studio', 'Studio', 1], ['choir', 'Choir'], ['queue', 'Queue'], ['models', 'Models'], ['menu', 'More']];
  function strip(cls) {
    return '<div class="hg-strip ' + (cls || '') + '" role="status"><span class="hg-strip__item">' + I('choir', 18) + '<strong>4 of 5</strong> voices</span>' +
      '<span class="hg-dots wide-only" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="q"></i><i></i><i></i></span>' +
      '<span class="hg-strip__item hg-strip__saved">Saved this month <span class="hg-num">+$214.60</span></span></div>';
  }
  var html =
    '<div class="hg-app" data-layout="auto">' +
      '<nav class="hg-app__nav" aria-label="Main"><div class="hg-app__brand"><img src="' + mark + '" alt="" style="height:30px"><img class="hg-wm" src="' + wm + '" alt="Hildegard"></div>' +
        nav.map(navItem).join('') +
        '<div class="hg-app__navfoot"><div class="hg-strip" style="flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px"><span class="hg-strip__item">' + I('choir', 18) + '<strong>4 of 5</strong> voices</span><span class="hg-strip__item" style="color:var(--text-primary)">Saved <span class="hg-num" style="color:var(--state-saved);font-size:15px">+$214.60</span></span></div></div></nav>' +
      '<header class="hg-app__top"><img class="hg-app__topbrand" src="' + mark + '" alt="Hildegard"><h1 class="hg-app__title">Studio</h1>' +
        '<div class="hg-app__topactions"><div class="hg-seg topswitch" data-hg-layout-switch role="radiogroup" aria-label="Layout">' +
          '<button role="radio" data-mode="auto" aria-checked="true" aria-label="Automatic">' + I('auto', 16) + '</button><button role="radio" data-mode="desktop" aria-label="Desktop">' + I('desktop', 16) + '</button><button role="radio" data-mode="tablet" aria-label="Tablet">' + I('tablet', 16) + '</button><button role="radio" data-mode="phone" aria-label="Phone">' + I('phone', 16) + '</button></div>' +
          '<button class="hg-btn hg-btn--icon hg-btn--ghost" aria-label="Search">' + I('search', 20) + '</button></div></header>' +
      '<main class="hg-app__main">' +
        '<div class="hello"><h1>What shall we make?</h1><p>Everything runs on your own devices unless you choose an outside model.</p></div>' +
        '<div class="hg-prompt"><textarea rows="2" aria-label="Describe what to make" placeholder="Describe a song, a voice line, a scene… or drop a file"></textarea>' +
          '<div class="hg-prompt__row"><div class="hg-scroll-x" role="group" aria-label="Kind of work">' +
            [['transcribe', 'Transcribe'], ['label', 'Label'], ['image', 'Image', 1], ['voice', 'Voice'], ['music', 'Music'], ['video', 'Video'], ['model3d', '3D']].map(function (c) { return '<button class="hg-chip" aria-pressed="' + !!c[2] + '">' + I(c[0], 16) + c[1] + '</button>'; }).join('') +
          '</div></div>' +
          '<div class="hg-prompt__row" style="border-top:1px solid var(--hairline);padding-top:12px"><span class="hg-prompt__where">' + I('server', 16) + 'Studio PC</span><span class="hg-prompt__where where-2">' + I('privacy', 16) + 'Private</span>' +
            '<div class="hg-prompt__meta"><span>Est. <span class="hg-num">$0.00</span> · saves <span class="hg-num">$0.04</span></span><button class="hg-btn hg-btn--primary">' + I('studio', 18) + 'Create</button></div></div></div>' +
        strip('main-strip') +
        '<section style="display:grid;gap:14px"><div class="hg-section-head"><h2>Recent creations</h2><a class="hg-btn hg-btn--sm hg-btn--ghost">See all</a></div><div class="hg-gallery">' + tiles.map(tile).join('') + '</div></section>' +
      '</main>' +
      '<aside class="hg-app__aside" aria-label="Choir now"><div style="display:grid;gap:4px"><span class="hg-overline">Choir now</span><h2 class="aside-h">Four voices singing</h2></div>' +
        '<div><div class="mini">' + I('server', 18) + '<span><b>Studio PC</b><small>RTX 4090 · 61%</small></span><span class="hg-status hg-status--running">Running</span></div>' +
        '<div class="mini">' + I('laptop', 18) + '<span><b>Studio Mac</b><small>M3 Max · 34%</small></span><span class="hg-status hg-status--running">Running</span></div>' +
        '<div class="mini">' + I('laptop', 18) + '<span><b>Laptop</b><small>free ~11:40 pm</small></span><span class="hg-status hg-status--queued">Queued</span></div>' +
        '<div class="mini">' + I('server', 18) + '<span><b>Den NAS</b><small>Server · idle</small></span><span class="hg-status hg-status--idle">Idle</span></div></div>' +
        '<div class="hg-card" style="padding:16px;display:grid;gap:8px"><span class="hg-overline">This month</span><div style="display:flex;justify-content:space-between;align-items:baseline"><span>Saved</span><span class="hg-num" style="font-size:24px;color:var(--state-saved)">+$214.60</span></div><div style="display:flex;justify-content:space-between;align-items:baseline;color:var(--text-secondary)"><span>Spent on APIs</span><span class="hg-num" style="color:var(--state-spent)">$3.12</span></div><hr class="hg-rule"><span style="font-size:12px;color:var(--text-muted)">Nothing left your devices except 2 requests to ElevenLabs.</span></div>' +
      '</aside>' +
      '<nav class="hg-tabbar" aria-label="Main">' + tabs.map(function (t) { return '<a class="hg-tab"' + (t[2] ? ' aria-current="page"' : '') + '>' + I(t[0], 22) + t[1] + '</a>'; }).join('') + '</nav>' +
    '</div>';
  document.querySelectorAll('[data-slot]').forEach(function (s) { s.innerHTML = html; Hildegard.watch(s.firstChild, { mode: 'auto' }); });
  document.querySelectorAll('.hg-chip').forEach(function (c) { c.addEventListener('click', function () { c.parentNode.querySelectorAll('.hg-chip').forEach(function (o) { o.setAttribute('aria-pressed', String(o === c)); }); }); });
})();
</script>
