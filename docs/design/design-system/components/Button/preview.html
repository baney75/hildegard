<!-- @dsCard group="Actions" height=236 subtitle="Primary, secondary, ghost, Force now, destructive; three sizes" -->
<div class="hg-root" style="padding:24px;display:grid;gap:20px;background:var(--canvas)">
  <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
    <button class="hg-btn hg-btn--primary"><i data-icon="studio" data-size="18"></i>Create</button>
    <button class="hg-btn">Variations</button>
    <button class="hg-btn hg-btn--sapphire">Open in Choir</button>
    <button class="hg-btn hg-btn--ghost">Cancel</button>
    <button class="hg-btn hg-btn--force"><i data-icon="force" data-size="18"></i>Force now</button>
    <button class="hg-btn hg-btn--danger">Remove device</button>
    <button class="hg-btn hg-btn--destroy">Delete forever</button>
    <button class="hg-btn hg-btn--primary" disabled>Create</button>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
    <button class="hg-btn hg-btn--sm">Retry</button>
    <button class="hg-btn hg-btn--sm hg-btn--ghost"><i data-icon="download" data-size="16"></i>Export</button>
    <button class="hg-btn hg-btn--icon" aria-label="Play"><i data-icon="play" data-size="18"></i></button>
    <button class="hg-btn hg-btn--icon hg-btn--ghost" aria-label="More"><i data-icon="more" data-size="20"></i></button>
    <button class="hg-btn hg-btn--lg hg-btn--primary"><i data-icon="plus" data-size="20"></i>Add a device</button>
  </div>
  <div style="max-width:360px"><button class="hg-btn hg-btn--lg hg-btn--primary hg-btn--block">Continue</button></div>
</div>
<script>Hildegard.hydrate(document)</script>
