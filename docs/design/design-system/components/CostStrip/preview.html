<!-- @dsCard group="Feedback" height=170 subtitle="Persistent cluster status and savings; wraps to two lines on phones" -->
<div class="hg-root" style="padding:24px;display:grid;gap:16px;background:var(--canvas)">
  <div class="hg-strip" role="status" aria-label="Cluster and savings">
    <span class="hg-strip__item"><i data-icon="choir" data-size="18"></i><strong>Choir</strong> 4 of 5 voices</span>
    <span class="hg-dots" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="q"></i><i></i><i></i></span>
    <span class="hg-strip__sep" aria-hidden="true"></span>
    <span class="hg-strip__item">2 running · 1 queued</span>
    <span class="hg-strip__sep" aria-hidden="true"></span>
    <span class="hg-strip__item hg-strip__spent">Spent <span class="hg-num">$3.12</span></span>
    <span class="hg-strip__item hg-strip__saved">Saved this month <span class="hg-num">+$214.60</span></span>
  </div>
  <div class="hg-strip" style="max-width:390px;flex-wrap:wrap;gap:4px 16px;padding:10px 16px" role="status" aria-label="Cluster and savings, compact">
    <span class="hg-strip__item"><i data-icon="choir" data-size="18"></i><strong>4 of 5</strong> voices</span>
    <span class="hg-strip__item hg-strip__saved">Saved <span class="hg-num">+$214.60</span></span>
  </div>
</div>
<script>Hildegard.hydrate(document)</script>
