<!-- @dsCard group="Feedback" height=150 subtitle="Every state carries a glyph and a word, never colour alone" -->
<div class="hg-root" style="padding:24px;display:grid;gap:18px;background:var(--canvas)">
  <div style="display:flex;flex-wrap:wrap;gap:28px;align-items:center">
    <span class="hg-status hg-status--running">Running</span>
    <span class="hg-status hg-status--queued">Queued · 3rd</span>
    <span class="hg-status hg-status--idle">Idle</span>
    <span class="hg-status hg-status--done">Done</span>
    <span class="hg-status hg-status--error">Out of memory on Studio Mac</span>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:28px;align-items:center">
    <span class="hg-status hg-status--server">Server</span>
    <span class="hg-status hg-status--opportunistic">Opportunistic</span>
    <span class="hg-dots" aria-label="Choir: 2 running, 1 queued, 2 idle"><i class="on"></i><i class="on"></i><i class="q"></i><i></i><i></i></span>
  </div>
</div>
