<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Corm;src:url(fonts/CormorantGaramond-500-Italic.woff2);font-style:italic}
@font-face{font-family:CormR;src:url(fonts/CormorantGaramond-500.woff2)}
@font-face{font-family:Mono;src:url(fonts/DMMono-400.woff2)}
html,body{margin:0;width:1920px;height:1080px;background:#040608;overflow:hidden}
#stage{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,#0d131a 0%,#06090c 55%,#020304 100%)}
#glow{position:absolute;left:50%;top:50%;width:1400px;height:1400px;margin:-700px 0 0 -700px;border-radius:50%;
 background:radial-gradient(circle,rgba(196,96,42,.32) 0%,rgba(196,96,42,.10) 25%,rgba(0,0,0,0) 60%);opacity:0}
#ember{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#f3a46b;box-shadow:0 0 18px 6px rgba(243,164,107,.7),0 0 80px 20px rgba(196,96,42,.35)}
.mono{position:absolute;font-family:Mono;font-size:26px;letter-spacing:.16em;color:#97968c;text-transform:lowercase;white-space:pre}
#words{position:absolute;left:0;right:0;top:50%;transform:translateY(-55%);text-align:center;font-family:Corm;font-style:italic;font-size:210px;color:#f2ecdd;line-height:1}
#words span{display:inline-block;margin:0 .14em;opacity:0}
#win{color:#e2bf6a}
#mark{position:absolute;left:50%;top:50%;width:300px;height:375px;margin:-200px 0 0 -150px;opacity:0}
#mark svg{width:100%;height:100%;overflow:visible}
#corner{position:absolute;right:80px;bottom:64px}
#grain{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:.07;mix-blend-mode:screen}
#scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);pointer-events:none}
#vign{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.75) 100%)}
#fade{position:absolute;inset:0;background:#000}
</style></head><body>

<div class="mono" id="corner"></div>
<canvas id="grain" width="510" height="295"></canvas><div id="scan"></div><div id="vign"></div><div id="fade"></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const ramp=(t,a,b)=>ease((t-a)/(b-a));
function rnd(s){s=Math.sin(s*127.1)*43758.5453;return s-Math.floor(s)}
function type(el,txt,t,a,cps=22){const n=Math.floor(cl((t-a)*cps,0,txt.length));const cur=(t>a&&Math.floor(t*2.5)%2==0&&n<=txt.length)?'▍':' ';el.textContent=txt.slice(0,n)+(t>a?cur:'')}
const L=[['l1','> uplink ............ none',1.2],['l2','> weights ........... on device',2.3],['l3','> requests sent ..... 0',3.4]];
const g=$('grain').getContext('2d'),img=g.createImageData(510,295);
window.render=function(t){
  const f=Math.round(t*30);
  // grain
  for(let i=0;i<img.data.length;i+=4){const v=rnd(i*.37+f*13.7)*255;img.data[i]=img.data[i+1]=img.data[i+2]=v;img.data[i+3]=255}
  g.putImageData(img,0,0);
  // ember point: breathes, then flares into the words and later the mark
  const flick=.85+.15*Math.sin(t*9.1)*Math.sin(t*3.7);
  const eIn=ramp(t,.3,1.4), eOut=1-ramp(t,4.2,5.0);
  $('ember').style.opacity=eIn*eOut*flick;
  $('ember').style.transform='scale('+(1+ramp(t,3.6,4.8)*3)+')';
  // terminal lines
  for(const [id,txt,a] of L){const el=$(id);type(el,txt,t,a);el.style.opacity=(1-ramp(t,4.6,5.4))*(t>a?1:0)}
  // words, one at a time, blur to sharp
  const W=[['w1',5.0],['w2',6.0],['w3',7.0],['win',8.3]];
  for(const [id,a] of W){const p=ramp(t,a,a+.9),o=1-ramp(t,11.0,11.8);const el=$(id);
    el.style.opacity=p*o;el.style.filter='blur('+((1-p)*18+(1-o)*10)+'px)';el.style.transform='translateY('+((1-p)*14)+'px)';}
  const wg=ramp(t,8.3,9.4)*(1-ramp(t,11,11.8));
  $('win').style.textShadow='0 0 '+(30+10*Math.sin(t*6))+'px rgba(226,191,106,'+(.55*wg)+'), 0 0 90px rgba(196,96,42,'+(.45*wg)+')';
  // slow push on everything
  $('words').style.transform='translateY(-55%) scale('+(1+t*.004)+')';
  // glow behind
  $('glow').style.opacity=ramp(t,8.3,9.6)*.6*(1-ramp(t,11,11.8))+ramp(t,12,13.4)*.9*flick*(1-ramp(t,14.4,15));
  // mark reveal
  const m=ramp(t,11.9,13.6);
  $('mark').style.opacity=m*(1-ramp(t,14.5,15));
  $('mark').style.filter='blur('+((1-m)*14)+'px) drop-shadow(0 0 '+(18*m)+'px rgba(226,191,106,.45))';
  $('mark').style.transform='scale('+(.94+.06*m+(t-12)*.004)+')';
  // corner tag
  const c=$('corner');type(c,'soon.',t,13.4,8);c.style.opacity=1-ramp(t,14.5,15);
  // fade in/out with occasional flicker
  const glitch=(t>4.95&&t<5.05)||(t>11.82&&t<11.9)?.6:0;
  $('fade').style.opacity=Math.max(1-ramp(t,0,.8),ramp(t,14.5,15),glitch);
};
render(0);
</script></body></html>
