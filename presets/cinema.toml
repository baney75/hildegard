# Cinema Studio presets. Licensed Apache-2.0 so anyone can reuse them.
# Every preset is plain words that end up in the prompt, plus optional film-look post settings
# (grain, halation, vignette...) applied by the HildegardLook node. Presets never name a model, so a
# rig keeps working when the model changes; per-model motion tricks live under [motions.impl.<model>].

version = 1
durations = [3, 5, 8, 10]

# ───────────────────────── Camera bodies ─────────────────────────

[[bodies]]
id = "full-frame"
name = "Full-frame cinema"
blurb = "Clean, wide latitude"
prompt = "shot on a full-frame digital cinema camera, clean image, wide dynamic range, natural highlight roll-off"
post = { grain = 0.04 }

[[bodies]]
id = "large-format"
name = "Large format 70mm"
blurb = "Vast, very fine grain"
prompt = "shot on 65mm large-format film, immense detail, very fine grain, epic depth"
post = { grain = 0.08, halation = 0.1 }

[[bodies]]
id = "vintage-16mm"
name = "Vintage 16mm"
blurb = "Grain, halation, gate weave"
prompt = "shot on vintage 16mm film, visible grain, soft halation around highlights, slight gate weave"
post = { grain = 0.45, halation = 0.35, gateWeave = 0.35, softness = 0.15, lift = 0.04 }

[[bodies]]
id = "super-35"
name = "Super 35"
blurb = "The classic feature look"
prompt = "shot on Super 35 motion picture film, classic feature film look, organic grain"
post = { grain = 0.2, halation = 0.15 }

[[bodies]]
id = "documentary"
name = "Documentary"
blurb = "Handheld, natural light"
prompt = "documentary camera, available natural light, observational, unpolished realism"
post = { grain = 0.1 }

[[bodies]]
id = "super-8"
name = "Super 8"
blurb = "Home movie warmth"
prompt = "shot on Super 8 home movie film, heavy grain, warm faded color, soft focus, light leaks"
post = { grain = 0.7, halation = 0.4, gateWeave = 0.6, softness = 0.35, warmth = 0.25, lift = 0.08, saturation = 0.85 }

[[bodies]]
id = "dv-camcorder"
name = "DV camcorder"
blurb = "2000s tape, sharp and harsh"
prompt = "shot on a 2000s miniDV camcorder, interlaced video look, oversharpened edges, clipped highlights"
post = { softness = 0.1, contrast = 1.1, saturation = 1.1 }

# ───────────────────────── Lenses ─────────────────────────

[[lenses]]
id = "clean"
name = "Clean modern"
blurb = "Sharp, neutral, no flare"
prompt = "modern prime lens, sharp, neutral rendering, no flare"

[[lenses]]
id = "anamorphic"
name = "Vintage anamorphic"
blurb = "Streak flares, oval bokeh"
prompt = "vintage anamorphic lens, horizontal blue streak flares, oval bokeh, widescreen framing"
aspect = "2.39:1"
post = { vignette = 0.25 }

[[lenses]]
id = "macro"
name = "Macro"
blurb = "Life size, razor-thin focus"
prompt = "macro lens, extreme close-up at life size, razor-thin focus plane"

[[lenses]]
id = "swirl"
name = "Swirl bokeh"
blurb = "Spinning background blur"
prompt = "vintage Petzval lens, swirling bokeh in the background, sharp center"
post = { vignette = 0.35 }

[[lenses]]
id = "diffusion"
name = "Soft diffusion"
blurb = "Gentle glow on highlights"
prompt = "lens with a soft diffusion filter, gentle glow blooming around highlights"
post = { halation = 0.3, softness = 0.2 }

# ───────────────────────── Focal lengths (full-frame equivalent) ─────────────────────────

[[focals]]
mm = 8
label = "Fisheye"
prompt = "8mm fisheye lens, strong barrel distortion"

[[focals]]
mm = 14
label = "Ultra wide"
prompt = "14mm ultra wide angle lens, exaggerated perspective"

[[focals]]
mm = 24
label = "Wide"
prompt = "24mm wide angle lens"

[[focals]]
mm = 35
label = "Natural"
prompt = "35mm lens, natural perspective"

[[focals]]
mm = 50
label = "Close"
prompt = "50mm lens, intimate framing"

[[focals]]
mm = 85
label = "Portrait"
prompt = "85mm portrait lens, compressed background"

[[focals]]
mm = 135
label = "Telephoto"
prompt = "135mm telephoto lens, strongly compressed perspective"

# ───────────────────────── Camera motion ─────────────────────────
# `path` is drawn on the motion card (160×100 box; the camera dot sits at the first point).

[[motions]]
id = "static"
name = "Static"
category = "static"
prompt = "locked-off static camera on a tripod, no camera movement"
path = "M66 36 L94 36 L94 64 L66 64 Z"
impl.ltx-2-distilled = { kind = "lora", lora = "camera-static", strength = 1.0 }

[[motions]]
id = "dolly-in"
name = "Dolly in"
category = "push"
prompt = "the camera slowly dollies in toward the subject"
path = "M40 72 L112 38"
impl.ltx-2-distilled = { kind = "lora", lora = "camera-dolly-in", strength = 1.0 }

[[motions]]
id = "dolly-out"
name = "Dolly out"
