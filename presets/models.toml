# Video models Cinema Studio can render with. Only open weights. Hildegard never rehosts weights:
# each file is fetched from its Hugging Face repo, at the commit and SHA-256 pinned in models.lock.json.
# Sizes here are approximate and shown before a download starts; the lock holds the exact ones.

# Every take passes this classifier before it is saved, and so does its start frame: a take with a sexual frame is
# refused and deleted (docs/safety.md). It downloads with whichever model is installed first. ViT-base, Apache-2.0,
# labels normal and nsfw. Its repo carries Hugging Face's not-for-all-audiences tag for what it detects.
[safety]
threshold = 0.8
classifier = { repo = "Falconsai/nsfw_image_detection", path = "model.safetensors", dir = "safety", size = 343223968 }

[[models]]
id = "ltx-2-5-distilled"
name = "LTX-2.5 distilled"
family = "ltx-2.5"
blurb = "Lightricks’ newest open model. Video and sound together, fast 8-step sampling."
license = "LTX-2.x Community License"
licenseUrl = "https://github.com/Lightricks/LTX-2/blob/main/LICENSE-2_x"
terms = [
  "Free for people and businesses under $10M in yearly revenue. Above that, Lightricks requires a paid license.",
  "You may not use it to build a product that competes with Lightricks’ own.",
  "Whenever you share what it makes, say plainly that it’s AI-generated (the license requires it), and keep its AI labels and provenance.",
  "No deepfakes of real people without their consent, and no sexual content.",
  "Hugging Face also asks you to accept the license on the model’s page before it can download.",
  "Its text encoder is built on Google’s Gemma 4, which comes under Google’s own license for Gemma.",
]
gated = true
graph = "ltx-2.5-distilled"
minVramGb = 24
# Its int8 weights run on int8 kernels, which Apple's GPU doesn't have.
mps = false
fps = 24
frameMultiple = 8
maxSeconds = 10
audio = true
draft = { height = 544, steps = 8, cfg = 1.0 }
final = { height = 1088, steps = 11, cfg = 1.0 }

