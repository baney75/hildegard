[[models]]
id = "wan-2-2-ti2v-5b"
name = "Wan 2.2 5B"
family = "wan-2.2"
blurb = "Alibaba’s open model under Apache-2.0: no usage limits, runs on a 12 GB GPU. Silent video."
license = "Apache-2.0"
licenseUrl = "https://github.com/Wan-Video/Wan2.2/blob/main/LICENSE.txt"
terms = [
  "Use it for anything, commercial work included, with no revenue limit.",
  "You are responsible for what you make with it, and for following the law where you publish it.",
]
graph = "wan-2.2-ti2v"
twoStageFinal = false
minVramGb = 12
# On Apple's GPU its fp16 weights render a blurred blob, at about 200 s a step on a 24 GB M5 (Oct 2026), so Macs
# render it on a paired device until it's proven there.
mps = false
fps = 24
frameMultiple = 4
maxSeconds = 5
audio = false
draft = { height = 480, steps = 20, cfg = 5.0 }
final = { height = 704, steps = 30, cfg = 5.0 }

