# Stills: character portraits and sheets, and the start frame of a shot with characters in it. FLUX.2 [klein] reads up
# to four reference images and keeps the people in them, which is what holds a character's face and clothes from shot
# to shot. The distilled 4B is the open one: Apache-2.0, like its Qwen3-4B text encoder.
[[models]]
id = "flux-2-klein-4b"
name = "FLUX.2 [klein] 4B"
kind = "image"
family = "flux-2-klein"
blurb = "Black Forest Labs’ open image model. Characters: portraits, sheets, and start frames that keep faces and clothes."
license = "Apache-2.0"
licenseUrl = "https://huggingface.co/black-forest-labs/FLUX.2-klein-4B"
terms = [
  "Use it for anything, commercial work included, with no revenue limit.",
  "Its text encoder, Qwen3-4B, is Apache-2.0 too.",
  "You are responsible for what you make with it. Hildegard draws a real person only with their consent.",
]
graph = "flux-2-klein"
references = 4
minVramGb = 13
draft = { height = 768, steps = 4, cfg = 1.0 }
final = { height = 1024, steps = 4, cfg = 1.0 }

