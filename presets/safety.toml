# What Hildegard refuses to make or load. Read by packages/presets/src/safety.ts; tests in packages/presets/test.
#
# Hildegard doesn't make sexual content, and never anything sexual or suggestive involving children. These lists are
# the first and cheapest of the checks: every prompt and every model or LoRA's name, tags and card pass through them.
# Rendered frames and start frames pass the classifier named in models.toml's [safety] table, and model files are
# checked against the hashes below before and after they download. See docs/safety.md.
#
# Words match whole words after folding case, accents, look-alike letters, l33t digits, s p a c e d letters and
# repeated letters. A trailing * matches any ending ("masturbat*"), and a plain word also matches its plural with -s.
# Phrases match their words in order.

version = 1

[prompt]
# Always refused, whatever surrounds them (unless an allowed phrase below covers the word, or it's negated).
sexual = [
  "nude", "nudes", "nudity", "naked", "nakedness", "topless", "bottomless", "unclothed", "undress*", "disrob*",
  "nsfw", "porn*", "xxx", "sex", "sexual*", "sexed", "intercourse", "erotic*", "erotica", "hentai", "ecchi",
  "smut*", "lewd*", "fetish*", "bdsm", "bondage", "orgasm*", "masturbat*", "ejaculat*", "cum", "cumshot*",
  "creampie*", "blowjob*", "handjob*", "footjob*", "fellatio", "cunnilingus", "genital*", "penis*", "vagina*",
  "vulva*", "clitor*", "labia", "testicle*", "scrotum", "anus", "anal", "nipple*", "areola*", "boob*", "tits",
  "titty", "titties", "pussy", "dildo*", "onlyfans", "camgirl*", "stripper*", "striptease", "gangbang*",
  "threesome*", "orgy", "orgies", "incest*", "rape", "raped", "raping", "rapist*", "molest*", "upskirt*",
  "downblouse", "voyeur*", "nipslip*", "milf*", "ahegao", "futanari", "futa", "yaoi", "rule34", "r34",
  "bukkake", "deepthroat*", "sodomy", "sodomize*", "bestiality", "zoophil*", "uncensored", "spread-eagle",
