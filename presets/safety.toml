  "desnud*", "nackt*", "sexo", "sesso", "nue", "nues", "hadaka", "erotik*", "pornografi*", "tetas", "seins",
  "голая", "голый", "порно", "секс", "эротика",
]
# Read as one word each: "no clothes" is as sexual as "naked", and isn't undone by "no".
sexualPhrases = [
  "no clothes", "without clothes", "no clothing", "without clothing", "wearing nothing",
  "not wearing anything", "takes off her clothes", "takes off his clothes", "taking off her clothes",
  "taking off his clothes", "take off her clothes", "take off his clothes", "remove her clothes",
  "remove his clothes", "removing her clothes", "removing his clothes", "clothes off", "in the nude",
  "birthday suit", "x rated", "adult film", "adult films", "adult video", "adult content", "adult movie",
  "sex scene", "making love", "make love", "oral sex", "bare breasts", "bare breast", "spread legs",
  "spreading her legs", "spread her legs", "wet t shirt", "nip slip", "camel toe", "18 plus", "for adults only",
]
# Sexual content involving children, by name. Refused as harshly as a child with a sexual word.
childSexual = [
  "lolicon", "loli", "lolis", "shotacon", "shota", "pedo", "pedos", "pedophil*", "paedo", "paedos", "paedophil*",
  "csam", "jailbait", "child porn", "kiddie porn", "underage sex",
]
# Not sexual on their own, so they pass; next to a child they are refused.
