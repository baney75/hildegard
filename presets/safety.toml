  "child", "children", "childlike", "kid", "kids", "kiddie*", "toddler*", "infant*", "baby", "babies",
  "preteen*", "tween*", "teen", "teens", "teenage*", "teenager*", "minor", "minors", "underage*",
  "under-age", "adolescen*", "schoolgirl*", "schoolboy*", "juvenile*", "youngster*",
  "kindergarten*", "daycare", "nursery", "grade-schooler*", "elementary", "pubescent", "prepubescent",
  "lolita", "enfant*", "fillette", "kinder", "mädchen",
  "ребенок", "девочка", "школьница",
]
minorPhrases = [
  "little girl", "little girls", "little boy", "little boys", "young girl", "young girls", "young boy",
  "young boys", "school girl", "school girls", "school boy", "school boys", "middle school", "high school",
  "grade school", "primary school", "elementary school", "pre teen", "barely legal", "small girl", "small boy",
  "underage girl", "underage boy", "1st grade", "2nd grade", "3rd grade", "4th grade", "5th grade", "6th grade",
  "7th grade", "8th grade", "9th grade",
]
# Where a listed word means something else. A match inside one of these is ignored.
allowed = [
  "nude color", "nude colour", "nude colors", "nude colours", "nude tone", "nude tones", "nude palette",
  "nude lipstick", "nude lip", "nude heels", "nude shoes", "nude makeup", "nude shade", "nude shades",
  "nude beige", "nude pink", "nude nail", "nude nails", "sex pistols", "sex and the city", "cum laude",
  "magna cum laude", "summa cum laude",
]
# Words that undo a sexual word right after them ("no nudity", "without sexual content").
# Only the word right before counts, or the one before "any": "no nudity", "without any sexual content".
negations = ["no", "not", "without", "non", "avoid", "avoiding", "never", "zero", "nothing"]

[models]
# A model or LoRA whose Hugging Face or Civitai tags include one of these is refused before it downloads.
blockedTags = [
  "not-for-all-audiences", "nsfw", "porn", "pornography", "hentai", "sexual", "sex", "nudity", "nude", "erotic",
  "adult", "explicit", "lewd", "uncensored", "fetish", "ecchi", "r18", "r-18", "xxx",
]
# Civitai's nsfwLevel is a bit field of the ratings its images carry: 1 PG, 2 PG-13, 4 R, 8 X, 16 XXX, 32 blocked. A
# model with any of these bits (R and above) is refused. Its `nsfw` flag alone can't be trusted: Pony Diffusion V6 XL
# reads nsfw = false with nsfwLevel 7. Models Civitai marks `minor` (made to depict children) or `poi` (a real person)
# are refused too.
civitaiBlockedNsfwBits = 60
# Repos and authors that only publish sexual models. "author/*" refuses everything from an author.
blockedRepos = []
# SHA-256 of model and LoRA files known to make sexual content, or to have been trained on children. A file with one
# of these hashes is refused before it downloads, deleted if it downloads anyway, and never loaded.
blockedSha256 = []
# The classifiers Hildegard itself downloads to find sexual frames. Their repos carry the not-for-all-audiences tag
# because of what they detect; that tag alone doesn't refuse them. Hash checks still apply.
trustedRepos = ["Falconsai/nsfw_image_detection"]
