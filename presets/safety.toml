  "sexy", "seductive*", "seduc*", "sensual*", "provocative*", "lingerie", "bikini*", "panties", "panty", "thong*",
  "underwear", "undies", "bra", "bras", "busty", "cleavage", "swimsuit*", "spank*", "flirt*", "straddl*",
