# Audio tags typed in brackets. They shape the delivery and are never spoken. Each model that can take a tag says how:
# Qwen3-TTS reads `direction` as acting direction, and Chatterbox raises or lowers its expressiveness by `lift`.
# Kokoro has no way to act, so the Studio shows its tags greyed out with that reason.
[[tags]]
id = "excited"
group = "emotion"
direction = "excited, eager"
lift = 0.3

