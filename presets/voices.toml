# Voice models and built-in voices. Only open weights, under licenses that allow commercial use. Hildegard never
# rehosts weights: each file comes from its publisher's Hugging Face repo, pinned like video models in
# models.lock.json (or by the hash Hugging Face publishes, on first install, until it is pinned there).
#
# `env` is the Python environment the model runs in (voice-engine/requirements/<env>.txt): Chatterbox and Qwen3-TTS
# pin different versions of the same libraries, so each family has its own. `can` is what it does: speak (with its
# own voices), clone (from a consented sample), design (a new voice from words), convert (speech to speech) and
# transcribe. `controls` are the Studio's sliders it honours; the rest show greyed out, with the reason.

# The consent check every clone passes (docs/voice.md): the speaker's recorded consent and each sample must be the
# same person. Chatterbox's speaker encoder (MIT), 5.7 MB; it downloads with any model that can clone.
[consent]
encoder = { repo = "ResembleAI/chatterbox", path = "ve.safetensors", size = 5695784 }
# Two clips this alike or more are the same person, on the encoder's cosine scale.
sameSpeaker = 0.75
# A consent phrase is good for this long after Hildegard writes it.
phraseMinutes = 10
# How much of the phrase must be heard, word for word, in order.
phraseMatch = 0.85
# A consent recording with Hildegard's watermark (or another AI voice's, where it carries the same mark) at this
# score or more was made by an AI, and can't consent for anyone.
markedAbove = 0.5
# Samples for a quick clone: at least this much speech in all, from one person.
quickSeconds = 10
# And for a pro clone.
proSeconds = 1800

